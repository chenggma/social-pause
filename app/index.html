<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Social Pause</title>
<meta name="theme-color" content="#E9EDEB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="停一下">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --ground:#E9EDEB; --surface:#F8FAF9; --surface-2:#EEF2F0; --ink:#1B2526; --muted:#566563; --line:#D0D8D5;
  --accent:#2C4A8A; --accent-ink:#FFFFFF; --accent-soft:#E2E8F5;
  --pause:#1E2D52; --pause-2:#2A3C68; --pause-ink:#E9EDF7; --pause-muted:#AEB9D6;
  --good:#2D6A52; --good-soft:#E0EEE7; --note:#7A5A1E; --note-soft:#F4ECDC;
  --paper:#FBF7EE; --paper-ink:#2B2620; --paper-line:#E4DAC6;
  --font:"Atkinson Hyperlegible","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#111817; --surface:#18201F; --surface-2:#1F2928; --ink:#E2E8E6; --muted:#98A6A3; --line:#2B3634;
    --accent:#93ACE6; --accent-ink:#0E1832; --accent-soft:#1E2A42;
    --pause:#121C3A; --pause-2:#1D2A55; --pause-ink:#E1E7F6; --pause-muted:#93A1C6;
    --good:#7CC3A2; --good-soft:#1A2E26; --note:#E2BE7A; --note-soft:#2E2718;
    --paper:#24211C; --paper-ink:#EDE6D8; --paper-line:#3A342B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#111817; --surface:#18201F; --surface-2:#1F2928; --ink:#E2E8E6; --muted:#98A6A3; --line:#2B3634;
  --accent:#93ACE6; --accent-ink:#0E1832; --accent-soft:#1E2A42;
  --pause:#121C3A; --pause-2:#1D2A55; --pause-ink:#E1E7F6; --pause-muted:#93A1C6;
  --good:#7CC3A2; --good-soft:#1A2E26; --note:#E2BE7A; --note-soft:#2E2718;
  --paper:#24211C; --paper-ink:#EDE6D8; --paper-line:#3A342B;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;padding:0 16px;padding-block:20px 40px}
button{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.topbar{max-width:1100px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{margin:0;font-size:22px;letter-spacing:.01em;cursor:default;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.brand .ver{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.top-actions{display:flex;gap:8px;align-items:center}
.pill{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.pill button{border:0;background:transparent;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.pill button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.stage{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}

.phone{background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;min-height:740px;display:flex;flex-direction:column;position:relative;max-width:440px;width:100%;margin:0 auto}
.hud{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;gap:10px;min-height:52px}
.when{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--muted)}
.when b{font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:500}
.iconbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:16px;height:16px}
.iconbtn .count{font-family:var(--mono);font-size:12px;color:var(--muted)}

.view{position:relative;margin:0 12px;border-radius:20px;overflow:hidden;background:#20262B;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.view svg{display:block;width:100%;height:auto;touch-action:none}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%, rgba(30,45,82,.35), rgba(16,24,48,.78));opacity:0;transition:opacity .45s ease;pointer-events:none}
.view.paused .veil{opacity:1}
.view.pov svg{filter:sepia(.35) saturate(.8)}
.pause-mark{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;gap:6px;opacity:0;transition:opacity .4s ease .1s;pointer-events:none}
.pause-mark i{width:7px;height:24px;border-radius:2px;background:#E9EDF7}
.view.paused .pause-mark{opacity:.9}
.thought{position:absolute;max-width:62%;background:#FFFFFF;color:#22262A;border-radius:18px;padding:8px 12px;font-size:14px;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;transform:translateY(6px) scale(.96);transition:opacity .3s ease, transform .3s ease;pointer-events:none}
.thought.on{opacity:1;transform:none}
.thought.cloud{border-radius:22px;background:#F4F1FF}
.thought small{display:block;font-size:11px;letter-spacing:.06em;color:#6B7280;margin-bottom:1px}
.timecard{position:absolute;inset:0;background:rgba(14,20,34,.88);color:#F2F4F8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.timecard b{font-family:var(--mono);font-size:44px;font-weight:500;letter-spacing:.04em}
.timecard span{font-size:18px;letter-spacing:.2em}
.timecard em{font-style:normal;font-size:12px;opacity:.6;margin-top:18px}

.box{margin:10px 12px 14px;background:var(--surface-2);border-radius:18px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;min-height:220px;flex:1;transition:background .45s ease,color .45s ease}
.box.pause{background:var(--pause);color:var(--pause-ink)}
.box.paper{background:var(--paper);color:var(--paper-ink)}
.speaker{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.box.pause .speaker{color:var(--pause-muted)}
.box.paper .speaker{color:var(--note)}
.line{font-size:17px;line-height:1.5;min-height:1.5em}
.line.mono-i{font-style:italic;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.4;cursor:pointer;min-height:48px;transition:border-color .15s ease, transform .1s ease}
.choice:active{transform:scale(.985)}
.choice.picked{border-color:var(--accent);background:var(--accent-soft)}
.choice.back{border-style:dashed;color:var(--muted);text-align:center}
.box.pause .choice{background:var(--pause-2);border-color:transparent;color:var(--pause-ink)}
.box.pause .choice.picked{border-color:var(--pause-ink)}
.choice:disabled{cursor:default}
.tray{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trayBtn{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 10px;font-size:16px;cursor:pointer;min-height:52px}
.trayBtn svg{width:20px;height:20px;flex:none}
.hint{font-size:14px;color:var(--muted)}
.box.pause .hint{color:var(--pause-muted)}
.primary{border:0;background:var(--ink);color:var(--surface);border-radius:14px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
.box.pause .primary{background:var(--pause-ink);color:var(--pause)}
.box.paper .primary{background:var(--paper-ink);color:var(--paper)}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:12px 14px;font-size:15px;cursor:pointer;width:100%}
.reply{border-left:3px solid var(--pause-muted);padding:2px 0 2px 12px;font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spacer{flex:1}

.journal{display:grid;gap:8px}
.journal .jr{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:baseline;font-size:15px}
.journal .k{font-size:11px;letter-spacing:.08em;color:var(--note);text-transform:uppercase}
.learn{font-size:17px;font-weight:700;line-height:1.45;border-top:1px dashed var(--paper-line);padding-top:10px}
.newnote{display:flex;gap:10px;align-items:center;background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;animation:slidein .5s ease .2s both}
.newnote b{display:block;font-size:12px;color:var(--good);letter-spacing:.04em}
@keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.home{flex:1;display:flex;flex-direction:column;gap:14px;padding:12px 16px 20px}
.home h2{margin:4px 0 0;font-size:30px;line-height:1.2}
.home p{margin:0}
.lead{font-size:17px}
.small{font-size:14px;color:var(--muted)}
.how{display:grid;gap:10px}
.how div{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;font-size:15px}
.how svg{width:36px;height:36px}
.nb{position:absolute;inset:0;background:var(--paper);color:var(--paper-ink);z-index:5;display:flex;flex-direction:column;padding:18px 16px;gap:12px;overflow:auto}
.nb.inline{position:relative;inset:auto;border-radius:16px;z-index:auto}
.nb h3{margin:0;font-size:20px}
.person{display:grid;grid-template-columns:52px 1fr;gap:12px;border-bottom:1px solid var(--paper-line);padding-bottom:12px}
.person svg{width:52px;height:52px;border-radius:50%;background:var(--paper-line)}
.person b{font-size:16px}
.person .rel{font-size:12px;color:var(--note)}
.person ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.person .locked{font-size:13px;color:var(--muted);font-style:italic}
.stat-line{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding:8px 0;font-size:16px}
.stat-line b{font-size:22px;font-variant-numeric:tabular-nums}

@keyframes react{0%{transform:translateY(0)}30%{transform:translateY(-6px)}60%{transform:translateY(1px)}100%{transform:translateY(0)}}
.npc.react{animation:react .5s ease}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.npc .bodyg{animation:breathe 3.2s ease-in-out infinite}
@keyframes glowp{0%,100%{opacity:.25}50%{opacity:.9}}
.lookglow{animation:glowp 1.8s ease-in-out infinite}
@keyframes ringp{0%,100%{opacity:.4}50%{opacity:1}}
.ringon{animation:ringp 1s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(0)}40%{opacity:.7}100%{opacity:0;transform:translateY(-14px)}}
.steam path{animation:steam 2.6s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.9s}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.eyes{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes screenpulse{0%,100%{opacity:1}50%{opacity:.55}}
.screenlit{animation:screenpulse 1.6s ease-in-out infinite}

.fac{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.fac-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.fac-head h2{margin:0;font-size:17px}
.fac-head .small{font-size:13px}
.sec-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 18px}
.ctl{display:flex;flex-direction:column;gap:6px;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;background:transparent;padding:6px 12px;font-family:var(--mono);font-size:13px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tog{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.tog input{width:18px;height:18px;accent-color:var(--accent)}
.example-flag{font-size:12px;color:var(--note);background:var(--note-soft);border-radius:999px;padding:3px 10px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile.key{border-color:var(--accent);background:var(--accent-soft)}
.tile .t{font-size:12px;color:var(--muted);line-height:1.3}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .d{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chart{border:1px solid var(--line);border-radius:12px;padding:8px 10px 6px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:4px 2px 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:400;text-transform:uppercase}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
tr:last-child td{border-bottom:0}
.lv{font-family:var(--mono);font-size:12px;padding:1px 7px;border-radius:6px;background:var(--surface-2)}
.ok{color:var(--good);font-weight:700}
.no{color:var(--note)}
.exports{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.exports button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer}
.exports .status{font-size:13px;color:var(--muted)}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);padding:10px}

@media (max-width:600px){
  body{padding:0;padding-block:0}
  .topbar{margin:0;padding:calc(env(safe-area-inset-top, 0px) + 10px) 16px 6px}
  .brand h1{font-size:18px}
  .brand .ver{display:none}
  .stage{gap:0}
  .phone{border:0;border-radius:0;max-width:none;min-height:calc(100dvh - 52px - env(safe-area-inset-top, 0px));padding-bottom:env(safe-area-inset-bottom, 0px)}
  .fac{display:none;border-radius:0;border-left:0;border-right:0}
  body.fac-open .fac{display:flex}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><h1 id="brandName">Social Pause</h1><span class="ver" id="verTag"></span></div>
  <div class="top-actions">
    <div class="pill"><button type="button" id="soundBtn" aria-pressed="true"></button></div>
    <div class="pill" role="group" aria-label="Language">
      <button type="button" id="lang-zh" data-lang="zh">中文</button>
      <button type="button" id="lang-en" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main class="stage">
  <section class="phone" id="phone" aria-live="polite"></section>
  <aside class="fac" id="fac"></aside>
</main>

<script>
(function(){
"use strict";

/* ============================ CONTENT ============================ */
const UI = {
  ver:{zh:"原型 0.2 · 一天",en:"prototype 0.2 · one day"},
  sound:{zh:"声音 开",en:"Sound on"}, soundOff:{zh:"声音 关",en:"Sound off"},
  title:{zh:"停一下",en:"Social Pause"},
  tagline:{zh:"跟着自己过完一天。好奇的时候，手常常比脑子快——试着让它停一下。",en:"Live through one day. When you're curious, your hand often moves first. Try to let it pause."},
  howHand:{zh:"拖动你的手，去碰东西",en:"Drag your hand to touch things"},
  howLook:{zh:"点一下人，看看对方、想想对方",en:"Tap a person to look at them and think about them"},
  howSay:{zh:"或者开口说话",en:"Or say something"},
  howNote:{zh:"没有计时，也没有分数。",en:"No timer, no score."},
  start:{zh:"开始这一天",en:"Start the day"},
  tapContinue:{zh:"轻点继续",en:"Tap to continue"},
  notebook:{zh:"笔记",en:"Notes"},
  you:{zh:"你",en:"You"},
  sayBtn:{zh:"说话",en:"Say something"},
  waitBtn:{zh:"先不动",en:"Hold off"},
  back:{zh:"算了，再想想",en:"Never mind"},
  dragHint:{zh:"拖动右下角的手 · 点人物 · 或者说话",en:"Drag the hand · tap a person · or speak"},
  explicit:{zh:"停一下。想想对方。",en:"Stop. Think about the other person."},
  explicitHint:{zh:"先点一下{n}，看看{n}。",en:"Tap {n} first and look at them."},
  lookHint:{zh:"看看{n}？",en:"Look at {n}?"},
  pauseWord:{zh:"停一下",en:"Pause"},
  handStopped:{zh:"你的手停在了半空。",en:"Your hand stops in midair."},
  youLooked:{zh:"你看了看{n}。",en:"You look at {n}."},
  backToScene:{zh:"回到现场",en:"Back to the moment"},
  cont:{zh:"继续",en:"Continue"},
  whatNext:{zh:"接下来你可以怎么做？",en:"What could you do now?"},
  povBtn:{zh:"{n}可能怎么想？",en:"What might {n} think?"},
  povSpeaker:{zh:"{n}可能在想",en:"{n} might be thinking"},
  maybe:{zh:"可能",en:"maybe"},
  guessNote:{zh:"这只是一种可能。真实的想法，要问了才知道。",en:"This is only a guess. You only really know by asking."},
  journal:{zh:"日记",en:"Journal"},
  fbNotice:{zh:"你做了",en:"You"}, fbWhy:{zh:"为什么",en:"Why"}, fbNext:{zh:"下次",en:"Next"},
  stopSelf:{zh:"你的手自己停下来了。",en:"You stopped your own hand."},
  lookSelf:{zh:"你先看了看对方。",en:"You looked at them first."},
  repaired:{zh:"你后来补救了，这很重要。",en:"You repaired it afterwards. That counts."},
  newNote:{zh:"新笔记",en:"New note"},
  nextStop:{zh:"下一站",en:"Next"},
  endDay:{zh:"结束这一天",en:"End the day"},
  dayOver:{zh:"这一天结束了",en:"The day is over"},
  nbTitle:{zh:"人物笔记",en:"People notebook"},
  nbEmpty:{zh:"还不了解。问一问，才会知道。",en:"Nothing yet. You learn by asking."},
  close:{zh:"合上笔记",en:"Close notebook"},
  endPaused:{zh:"你停下来想一想",en:"Times you paused"},
  endAsked:{zh:"你先问、或先等",en:"Times you asked or waited"},
  endNotes:{zh:"笔记里记下的事",en:"Things in your notebook"},
  again:{zh:"再过一天",en:"Live the day again"},
  home:{zh:"回到首页",en:"Back to start"},
  relGood:{zh:"相处自然",en:"Easy between you"},
  relRepair:{zh:"有过小插曲，已经说开了",en:"A small bump, talked through"},
  relCool:{zh:"有一点生疏",en:"A little distant"},
  relNone:{zh:"今天还没见面",en:"Haven't met today"},
  oneDay:{zh:"一天",en:"One day"}, places:{zh:"5 个地方",en:"5 places"}
};

const PEOPLE = {
  lin:{n:{zh:"小林",en:"Lin"}, skin:"#E2B48F", hair:"#2B2422", hairStyle:"bob", shirt:"#4C8C86"},
  zhou:{n:{zh:"小周",en:"Zhou"}, skin:"#D9A47E", hair:"#1F1B1A", hairStyle:"short", shirt:"#C79A3E"},
  mei:{n:{zh:"小美",en:"Mei"}, skin:"#EDC3A0", hair:"#4A2F25", hairStyle:"long", shirt:"#B86B6B"},
  ning:{n:{zh:"阿宁",en:"Ning"}, skin:"#C98F6B", hair:"#2A1E1A", hairStyle:"long", shirt:"#7D5A8C"},
  cow:{n:{zh:"同事",en:"Coworker"}, skin:"#DDB08C", hair:"#5A5552", hairStyle:"short", shirt:"#6F8296"}
};

let actx=null;
function sfx(kind){
  if(!state.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const t=actx.currentTime;
    const tone=(f,dur,type,vol,delay,f2)=>{ delay=delay||0; const o=actx.createOscillator(), gg=actx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t+delay); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+delay+dur); gg.gain.setValueAtTime(0,t+delay); gg.gain.linearRampToValueAtTime(vol,t+delay+.015); gg.gain.exponentialRampToValueAtTime(.0001,t+delay+dur); o.connect(gg); gg.connect(actx.destination); o.start(t+delay); o.stop(t+delay+dur+.05); };
    if(kind==="tap") tone(660,.08,"sine",.05);
    if(kind==="pause"){ tone(392,.9,"sine",.07,0,330); tone(587,.9,"sine",.035,.05,494); }
    if(kind==="touch") tone(220,.25,"triangle",.06,0,180);
    if(kind==="good"){ tone(523,.25,"sine",.05); tone(784,.35,"sine",.04,.09); }
    if(kind==="note"){ tone(880,.18,"sine",.04); tone(1175,.3,"sine",.035,.1); }
    if(kind==="page") tone(300,.18,"triangle",.03,0,500);
    if(kind==="ping") tone(1320,.12,"sine",.03);
  }catch(e){}
}

    g += `<circle cx="252" cy="70" r="70" fill="url(#lampGlow)"/><path d="M240 60 h24 l6 18 h-36 Z" fill="#F2E3C6"/><rect x="250" y="78" width="4" height="120" fill="#4A4038"/>`;
    g += npc;
    g += `<ellipse cx="200" cy="248" rx="120" ry="18" fill="#B49172" opacity=".55"/>`;
    g += `<rect x="118" y="198" width="150" height="9" rx="3" fill="#6F5442"/><rect x="128" y="207" width="7" height="30" fill="#5A4436"/><rect x="250" y="207" width="7" height="30" fill="#5A4436"/>`;
    g += `<rect x="226" y="186" width="16" height="12" rx="2" fill="#E9E1D3"/>`;

  if(o.hand) g += handSVG(o.handAt || HAND_START);
  return `<svg viewBox="0 0 ${W} ${H}" id="sceneSvg" role="img" aria-label="${esc(L(s.sit))}">${g}</svg>`;
}

/* ---------- the player's hand ---------- */
const HAND_BASE={x:352,y:330}, HAND_START={x:296,y:256};
function handGeom(tip){
  const dx=tip.x-HAND_BASE.x, dy=tip.y-HAND_BASE.y;
  return {ang:Math.atan2(dy,dx)*180/Math.PI, sx:HAND_BASE.x+dx*.5, sy:HAND_BASE.y+dy*.5};
}
function handSVG(tip){
  const g=handGeom(tip);
  return `<g id="hand">
    <line id="armSkin" x1="${HAND_BASE.x}" y1="${HAND_BASE.y}" x2="${tip.x}" y2="${tip.y}" stroke="#E6B892" stroke-width="22" stroke-linecap="round"/>
    <line id="armSleeve" x1="${HAND_BASE.x}" y1="${HAND_BASE.y}" x2="${g.sx}" y2="${g.sy}" stroke="#35557E" stroke-width="34" stroke-linecap="round"/>
    <g id="palm" transform="translate(${tip.x} ${tip.y}) rotate(${g.ang})">
      <ellipse cx="2" cy="0" rx="17" ry="14" fill="#E6B892"/>
      <rect x="10" y="-11" width="16" height="6" rx="3" fill="#E6B892"/><rect x="12" y="-4" width="17" height="6" rx="3" fill="#E6B892"/><rect x="11" y="3" width="15" height="6" rx="3" fill="#E6B892"/>
      <ellipse cx="2" cy="-13" rx="8" ry="5" fill="#DDAA83" transform="rotate(-25 2 -13)"/>
    </g>
    <circle id="reachRing" cx="${tip.x}" cy="${tip.y}" r="30" fill="none" stroke="#FFF1B0" stroke-width="3" opacity="0"/>
    <circle id="handHit" cx="${tip.x}" cy="${tip.y}" r="46" fill="transparent" style="cursor:grab"/>
  </g>`;
}
function moveHand(tip){
  const svg=document.getElementById("sceneSvg"); if(!svg) return;
  const g=handGeom(tip);
  const set=(id,a)=>{ const el=svg.querySelector("#"+id); if(el) for(const k in a) el.setAttribute(k,a[k]); };
  set("armSkin",{x2:tip.x,y2:tip.y}); set("armSleeve",{x2:g.sx,y2:g.sy});
  set("palm",{transform:`translate(${tip.x} ${tip.y}) rotate(${g.ang})`});
  set("reachRing",{cx:tip.x,cy:tip.y}); set("handHit",{cx:tip.x,cy:tip.y});
}

function portrait(key, size){
  const p=PEOPLE[key];
  return `<svg viewBox="0 0 52 52" ${size?`width="${size}" height="${size}"`:""} aria-hidden="true"><circle cx="26" cy="30" r="15" fill="${p.skin}"/><path d="M10 52 q16 -16 32 0 Z" fill="${p.shirt}"/><path d="M10 30 q0 -18 16 -18 q16 0 16 18 l-4 0 q-2 -11 -12 -11 q-10 0 -12 11 Z" fill="${p.hair}"/><circle cx="21" cy="31" r="1.6" fill="#2B2422"/><circle cx="31" cy="31" r="1.6" fill="#2B2422"/><path d="M22 37 q4 3 8 0" stroke="#7A4A3E" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`;
}

/* ============================ FLOW ============================ */
const $phone=document.getElementById("phone");
let typer=null;

function startDay(){ state.idx=0; state.level=state.settings.startLevel; state.streak=0; state.facts={}; state.rel={}; state.nbOpen=false; startScene(); }
function startScene(){
  const s=scn();
  state.cur={ session_id:state.sessionId, round:state.round, scenario_id:s.id, domain:"personal_boundary", difficulty:s.d,
    prompt_level:LEVEL_NAME[state.level], level:state.level, transfer_trial:s.transfer,
    paused:0, pause_type:null, pause_forced:0, reach_max:0, owner_answer:null, perspective_answer:null, uncertain_used:0,
    choice:null, kind:null, correctness:null, response_time_ms:null, repair_used:0, repair_choice:null, repair_success:null,
    pov_viewed:0, fact_earned:0, hint_used:state.level>0?1:0, cue_shown:0, t0:null, ts:new Date().toISOString() };
  state.screen="play"; setPhase("timecard");
}
function setPhase(p){ state.phase=p; state.pick=null; state.menu=null; render(); }
function finishScene(){
  const c=state.cur, ok=c.correctness===1, s=scn();
  delete c.t0;
  state.trials.push(c);
  state.rel[s.pov.who] = ok ? "good" : (c.repair_success ? "repair" : "cool");
  if(state.settings.adaptive){
    if(ok){ state.streak++; if(state.streak>=state.settings.fadeAfter && state.level>0){ state.level--; state.streak=0; } }
    else { state.streak=0; if(state.level<3) state.level++; }
  }
  renderFac();
}
function earnFact(){
  const s=scn(), c=state.cur;
  if(c.fact_earned) return;
  c.fact_earned=1;
  const w=s.fact.who; state.facts[w]=state.facts[w]||[];
  if(!state.facts[w].includes(s.id)) state.facts[w].push(s.id);
}
function commit(a, kind){
  const c=state.cur;
  c.choice=a.id; c.kind=kind; c.correctness=a.ok; c.action=a;
  if(kind==="touch") c.reach_max=1;
  c.response_time_ms=Math.round(performance.now()-c.t0);
  if(a.ok && a.fact) earnFact();
  sfx(a.ok?"good":"touch");
  setPhase("consequence");
}

/* ============================ RENDER ============================ */
function hudHTML(){
  const s=scn(), n=Object.values(state.facts).reduce((a,b)=>a+b.length,0);
  return `<div class="hud"><div class="when"><b>${s.time}</b><span>${esc(L(s.place))}</span></div>
    <button type="button" class="iconbtn" id="nbBtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="2" width="10" height="12" rx="1.5"/><path d="M6 5h4M6 8h4"/></svg>${esc(T("notebook"))}<span class="count">${n}</span></button></div>`;
}
const SAY_ICON=`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h9A2.5 2.5 0 0 1 17 5.5v5a2.5 2.5 0 0 1-2.5 2.5H9l-4 3v-3h.5A2.5 2.5 0 0 1 3 10.5Z"/></svg>`;
const WAIT_ICON=`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg>`;

function render(){
  if(typer){ clearInterval(typer.id); typer=null; }
  if(state.screen==="home") return renderHome();
  if(state.screen==="end") return renderEnd();
  const s=scn(), c=state.cur, ph=state.phase, lv=state.level, pn=nm(s.npc);
  let viewCls="", so={}, box="", boxCls="", overlay="";

  if(ph==="timecard"){
    overlay=`<div class="timecard" id="tc"><b>${s.time}</b><span>${esc(L(s.place))}</span><em>${esc(T("tapContinue"))}</em></div>`;
    box=`<div class="speaker">${esc(T("journal"))}</div><div class="line">${esc(L(s.sit))}</div>`;
  }
  else if(ph==="decide"){
    if(s.greet && !c.greeted){
      so={near:true, expr:"smile"};
      box=`<div class="speaker">${esc(pn)}</div><div class="line" id="typeLine"></div><div class="spacer"></div><button type="button" class="primary" id="greetOk">${esc(T("cont"))}</button>`;
    } else {
      if(c.t0==null) c.t0=performance.now();
      const forced = lv===3 && !c.paused;
      so={hand:!forced, glow:(lv>=2 && !c.paused), hint:(lv===2 && !c.paused)?T("lookHint",pn):null};
      if(state.menu){
        const list=s[state.menu];
        box=`<div class="speaker">${esc(T("you"))}</div><div class="choices">${list.map(a=>`<button type="button" class="choice" data-act="${a.id}">${esc(L(a.l))}</button>`).join("")}<button type="button" class="choice back" id="menuBack">${esc(T("back"))}</button></div>`;
      } else if(forced){
        box=`<div class="hint">${esc(L(s.sit))}</div><div class="speaker">⏸ ${esc(T("pauseWord"))}</div><div class="line" style="font-weight:700">${esc(T("explicit"))}</div><div class="hint">${esc(T("explicitHint",pn))}</div>`;
      } else {
        box=`<div class="hint">${esc(L(s.sit))}</div><div class="speaker">${esc(T("you"))}</div><div class="line mono-i" id="typeLine"></div><div class="spacer"></div>
          <div class="tray"><button type="button" class="trayBtn" id="sayBtn">${SAY_ICON}${esc(T("sayBtn"))}</button><button type="button" class="trayBtn" id="waitBtn">${WAIT_ICON}${esc(T("waitBtn"))}</button></div>
          ${state.idx===0 && !c.paused ? `<div class="hint" style="text-align:center">${esc(T("dragHint"))}</div>`:""}`;
      }
    }
  }
  else if(ph==="pause1"||ph==="pause2"){
    viewCls="paused"; boxCls="pause";
    so={hand:c.pause_type==="stop", handAt:c.stopAt};
    const q = ph==="pause1" ? s.owner : s.persp;
    const picked = state.pick ? q.opts.find(o=>o.id===state.pick) : null;
    const lead = ph==="pause1" ? (c.pause_type==="stop" ? T("handStopped") : T("youLooked",pn)) : "";
    box=`<div class="speaker">⏸ ${esc(T("pauseWord"))}</div>${lead?`<div class="hint">${esc(lead)}</div>`:""}<div class="line">${esc(L(q.q))}</div>
      <div class="choices">${q.opts.map(o=>`<button type="button" class="choice${state.pick===o.id?" picked":""}" data-q="${o.id}" ${state.pick?"disabled":""}>${esc(L(o.l))}</button>`).join("")}</div>`;
    if(picked) box+=`<div class="reply">${esc(L(picked.r))}</div><button type="button" class="primary" id="qNext">${esc(ph==="pause1"?T("cont"):T("backToScene"))}</button>`;
    overlay=`<div class="pause-mark"><i></i><i></i></div>` + (ph==="pause2" ? `<div class="thought cloud" id="npcThought" style="right:5%;top:14%"><small>${esc(pn)}</small>？</div>` : "");
  }
  else if(ph==="consequence"){
    const a=c.action;
    so={obj:a.obj||"base", expr:a.expr||"neutral", react:true, near:!!a.npcNear, hand:c.kind==="touch", handAt:s.target};
    box=`${a.narr?`<div class="line mono-i">${esc(L(a.narr))}</div>`:""}${a.npc?`<div class="speaker">${esc(nm(a.who||s.npc))}</div><div class="line" id="typeLine"></div>`:""}<div class="spacer"></div>`;
    box+= a.ok ? `<div class="row2"><button type="button" class="ghost" id="povBtn">${esc(T("povBtn",nm(s.pov.who)))}</button><button type="button" class="primary" id="toJournal">${esc(T("cont"))}</button></div>`
               : `<button type="button" class="primary" id="toRepair">${esc(T("whatNext"))}</button>`;
  }
  else if(ph==="repair"){
    const a=c.action, picked = state.pick ? s.repair.find(r=>r.id===state.pick) : null;
    if(!picked){
      so={obj:a.obj||"base", expr:a.expr||"neutral", near:!!a.npcNear, hand:c.kind==="touch", handAt:s.target};
      box=`<div class="speaker">${esc(T("you"))}</div><div class="line">${esc(T("whatNext"))}</div><div class="choices">${s.repair.map(r=>`<button type="button" class="choice" data-rep="${r.id}">${esc(L(r.l))}</button>`).join("")}</div>`;
    } else {
      so={obj:picked.ok?"base":(a.obj||"base"), expr:picked.expr||a.expr||"neutral", react:true, near:!!(picked.npcNear||a.npcNear), hand:!picked.ok && c.kind==="touch", handAt:s.target};
      box=`${picked.narr?`<div class="line mono-i">${esc(L(picked.narr))}</div>`:""}${picked.npc?`<div class="speaker">${esc(nm(picked.who||a.who||s.npc))}</div><div class="line" id="typeLine"></div>`:""}<div class="spacer"></div>
        <div class="row2"><button type="button" class="ghost" id="povBtn">${esc(T("povBtn",nm(s.pov.who)))}</button><button type="button" class="primary" id="toJournal">${esc(T("cont"))}</button></div>`;
    }
  }
  else if(ph==="pov"){
    viewCls="pov";
    const good = c.correctness===1 || c.repair_success, who=s.pov.who;
    so={obj:"base", expr:good?"smile":"uneasy", near:!!c.action.npcNear};
    box=`<div class="speaker">${esc(T("povSpeaker",nm(who)))}</div><div class="hint">${esc(T("guessNote"))}</div><div class="spacer"></div><button type="button" class="primary" id="toJournal">${esc(T("cont"))}</button>`;
    overlay=`<div class="thought cloud" id="povThought" style="left:6%;top:8%"><small>${esc(nm(who))} · ${esc(T("maybe"))}</small>${esc(L(good?s.pov.good:s.pov.bad))}</div>`;
  }
  else if(ph==="journal"){
    boxCls="paper";
    const ok=c.correctness===1;
    so={obj:"base", expr:(ok||c.repair_success)?"smile":"neutral", near:!!c.action.npcNear};
    let notice="";
    if(ok) notice=(c.paused && !c.pause_forced ? (c.pause_type==="stop"?T("stopSelf"):T("lookSelf"))+" " : "") + L(s.fb.notice);
    else if(c.repair_success) notice=T("repaired");
    const last=state.idx===SC.length-1;
    box=`<div class="speaker">${esc(T("journal"))} · ${s.time}</div>
      <div class="journal">
        ${notice?`<div class="jr"><span class="k">${esc(T("fbNotice"))}</span><span>${esc(notice)}</span></div>`:""}
        <div class="jr"><span class="k">${esc(T("fbWhy"))}</span><span>${esc(L(s.fb.why))}</span></div>
        ${!ok?`<div class="jr"><span class="k">${esc(T("fbNext"))}</span><span>${esc(L(s.fb.next))}</span></div>`:""}
      </div>
      <div class="learn">${esc(L(s.learn))}</div>
      ${c.fact_earned?`<div class="newnote">${portrait(s.fact.who,34)}<div><b>${esc(T("newNote"))} · ${esc(nm(s.fact.who))}</b>${esc(L(s.fact))}</div></div>`:""}
      <div class="spacer"></div>
      <button type="button" class="primary" id="nextScene">${esc(last?T("endDay"):T("nextStop"))}</button>`;
  }

  $phone.innerHTML=`${hudHTML()}
    <div class="view ${viewCls}" id="view">${sceneSVG(s,so)}<div class="veil"></div>${overlay}</div>
    <div class="box ${boxCls}" id="box">${box}</div>
    ${state.nbOpen?notebookHTML(true):""}`;
  wirePlay();
}

function typeInto(text){
  const el=document.getElementById("typeLine"); if(!el) return;
  let i=0; el.textContent="";
  const id=setInterval(()=>{ i++; el.textContent=text.slice(0,i); if(i>=text.length){ clearInterval(id); typer=null; } }, state.lang==="zh"?40:18);
  typer={id, finish:()=>{ clearInterval(id); el.textContent=text; typer=null; }};
}

function wirePlay(){
  const s=scn(), c=state.cur, ph=state.phase, q=sel=>$phone.querySelector(sel), all=sel=>$phone.querySelectorAll(sel);
  q("#box")?.addEventListener("click",()=>{ if(typer) typer.finish(); });
  q("#nbBtn")?.addEventListener("click",()=>{ sfx("page"); state.nbOpen=true; render(); });
  q("#nbClose")?.addEventListener("click",()=>{ sfx("page"); state.nbOpen=false; render(); });
  if(state.nbOpen) return;

  if(ph==="timecard"){ q("#tc").addEventListener("click",()=>{ sfx("tap"); setPhase("decide"); }); return; }

  if(ph==="decide"){
    if(s.greet && !c.greeted){
      const warm = state.rel.lin==="good" || state.rel.lin==="repair";
      typeInto(L(warm?s.greet.warm:s.greet.plain));
      q("#greetOk").addEventListener("click",()=>{ sfx("tap"); c.greeted=1; render(); });
      return;
    }
    typeInto(L(s.mono));
    q("#sayBtn")?.addEventListener("click",()=>{ sfx("tap"); state.menu="say"; render(); });
    q("#waitBtn")?.addEventListener("click",()=>{ sfx("tap"); state.menu="wait"; render(); });
    q("#menuBack")?.addEventListener("click",()=>{ sfx("tap"); state.menu=null; render(); });
    all("[data-act]").forEach(b=>b.addEventListener("click",()=>commit(s[state.menu].find(x=>x.id===b.dataset.act), state.menu)));
    all(".npc-hit").forEach(h=>h.addEventListener("click",()=>{
      if(c.paused) return;
      if(state.level===3) c.pause_forced=1;
      c.paused=1; c.pause_type="look"; sfx("pause"); setPhase("pause1");
    }));
    wireDrag();
    return;
  }
  if(ph==="pause1"||ph==="pause2"){
    if(ph==="pause2") setTimeout(()=>q("#npcThought")?.classList.add("on"),250);
    all("[data-q]").forEach(b=>b.addEventListener("click",()=>{
      sfx("tap"); const id=b.dataset.q; state.pick=id;
      if(ph==="pause1") c.owner_answer=id; else c.perspective_answer=id;
      if(id==="unsure") c.uncertain_used=1;
      render();
    }));
    q("#qNext")?.addEventListener("click",()=>{ sfx("tap"); if(ph==="pause1") setPhase("pause2"); else { c.stopAt=null; setPhase("decide"); } });
    return;
  }
  const toJ=()=>q("#toJournal")?.addEventListener("click",()=>{ sfx("page"); setPhase("journal"); });
  const povB=()=>q("#povBtn")?.addEventListener("click",()=>{ sfx("tap"); c.pov_viewed=1; setPhase("pov"); });
  if(ph==="consequence"){
    if(c.action.npc) typeInto(L(c.action.npc));
    q("#toRepair")?.addEventListener("click",()=>{ sfx("tap"); setPhase("repair"); });
    toJ(); povB(); return;
  }
  if(ph==="repair"){
    all("[data-rep]").forEach(b=>b.addEventListener("click",()=>{

      sfx(r.ok?"good":"touch"); state.pick=r.id; render();
    }));
    if(state.pick){ const r=s.repair.find(x=>x.id===state.pick); if(r.npc) typeInto(L(r.npc)); }
    toJ(); povB(); return;
  }
  if(ph==="pov"){
    setTimeout(()=>q("#povThought")?.classList.add("on"),150);
    toJ(); return;
  }
  if(ph==="journal"){
    if(c.fact_earned) setTimeout(()=>sfx("note"),350);
    q("#nextScene").addEventListener("click",()=>{
      sfx("tap"); finishScene();
      if(state.idx<SC.length-1){ state.idx++; startScene(); }
      else { state.cur=null; state.screen="end"; render(); }
    });
  }
}

/* ---------- drag the hand ---------- */
function wireDrag(){
  const svg=document.getElementById("sceneSvg"), hit=svg && svg.querySelector("#handHit");
  if(!hit) return;
  const s=scn(), c=state.cur, lv=state.level, ring=svg.querySelector("#reachRing");
  const T0=HAND_START, TG=s.target, D=Math.hypot(TG.x-T0.x, TG.y-T0.y);
  let dragging=false, done=false, tip={...T0};
  const toSvg=e=>{ const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
  const prog=()=>Math.max(0, Math.min(1, 1-Math.hypot(TG.x-tip.x, TG.y-tip.y)/D));
  hit.addEventListener("pointerdown",e=>{ e.preventDefault(); dragging=true; try{ hit.setPointerCapture(e.pointerId); }catch(_){} hit.style.cursor="grabbing"; });
  hit.addEventListener("pointermove",e=>{
    if(!dragging||done) return;
    const p=toSvg(e); tip={x:Math.max(10,Math.min(W-6,p.x)), y:Math.max(20,Math.min(H+30,p.y))};
    moveHand(tip);
    const pr=prog(); c.reach_max=Math.max(c.reach_max, Math.round(pr*100)/100);
    if(ring){ const on = lv===2 && pr>.35 && !c.paused; ring.setAttribute("opacity", on?"1":"0"); ring.classList.toggle("ringon", on); }
    if(lv===1 && pr>.25 && !c.cue_shown && !c.paused){ c.cue_shown=1; showCue(); }
    if(Math.hypot(TG.x-tip.x, TG.y-tip.y) < 24){ done=true; dragging=false; commit(s.touch,"touch"); }
  });
  const end=()=>{
    if(!dragging||done) return; dragging=false;
    if(prog()>=.2 && !c.paused){ done=true; c.paused=1; c.pause_type="stop"; c.stopAt={...tip}; sfx("pause"); setPhase("pause1"); return; }
    const from={...tip}, t0=performance.now();
    const step=t=>{ const k=Math.min(1,(t-t0)/260), e=1-Math.pow(1-k,3); tip={x:from.x+(T0.x-from.x)*e, y:from.y+(T0.y-from.y)*e}; moveHand(tip); if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
    if(ring){ ring.setAttribute("opacity","0"); ring.classList.remove("ringon"); }
  };
  hit.addEventListener("pointerup",end); hit.addEventListener("pointercancel",end);
}
function showCue(){
  const s=scn(), view=document.getElementById("view");
  const d=document.createElement("div"); d.className="thought"; d.style.right="4%"; d.style.top="6%";
  d.innerHTML=`<small>${esc(nm(s.npc))}</small>${esc(L(s.cue))}`; view.appendChild(d);
  sfx("ping"); requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add("on")));
}

function pct(a,b){ return b?Math.round(100*a/b)+"%":"—"; }
function metrics(rows){
  const p0=rows.filter(r=>r.level===0), nf=rows.filter(r=>r.level<3), okR=rows.filter(r=>r.correctness===1), miss=rows.filter(r=>r.repair_used), st=rows.filter(r=>r.pause_type==="stop");
  const sp=nf.filter(r=>r.paused&&!r.pause_forced).length, p0ok=p0.filter(r=>r.correctness===1).length, rs=miss.filter(r=>r.repair_success).length;
  return {
    isr:[pct(p0ok,p0.length),`${p0ok}/${p0.length}`],
    spont:[pct(sp,nf.length),`${sp}/${nf.length}`],
    dep:[okR.length?"P"+(okR.reduce((a,r)=>a+r.level,0)/okR.length).toFixed(1):"—",`n=${okR.length}`],
    acc:[pct(okR.length,rows.length),`${okR.length}/${rows.length}`],
    reach:[st.length?Math.round(100*st.reduce((a,r)=>a+r.reach_max,0)/st.length)+"%":"—",`n=${st.length}`],
    rep:[pct(rs,miss.length),`${rs}/${miss.length}`]
  };

function ladderSVG(rows){

  for(let i=0;i<n;i++) g+=`<text x="${x(i)}" y="${Hc-6}" text-anchor="middle" font-size="10" font-family="var(--mono)" fill="var(--muted)">${i+1}</text>`;
  if(rows.length>1){ let d=`M${x(0)} ${y(rows[0].level)}`; rows.forEach((r,i)=>{ if(i>0) d+=` H${x(i)} V${y(r.level)}`; }); g+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" opacity=".55"/>`; }

  return `<svg viewBox="0 0 ${Wc} ${Hc}" role="img" aria-label="${esc(FL("ladder"))}">${g}</svg>`;
}

    const fb=()=>{ box.hidden=false; box.value=text; box.focus(); box.select(); status.textContent=FL("copyFail"); };
    try{ navigator.clipboard.writeText(text).then(()=>{ status.textContent=FL("copied"); box.hidden=true; }, fb); }catch(e){ fb(); } };
